<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Диагностика шапки</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #F7F8FA;
    color: #111318;
    font-size: 16px;
  }

  /* шапка ведёт себя ровно как на сайте */
  .hdr {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 72px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    background: #3157FF;
    color: #fff;
    font-weight: 700;
  }

  .filler {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 0;
    background: #E11D48;   /* ярко-красный, чтобы было видно, сработала ли заглушка */
    z-index: 99;
  }

  .band { padding: 20px; }
  .band p { font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 16px; }

  #out {
    position: fixed;
    left: 8px; right: 8px; bottom: 8px;
    z-index: 500;
    background: #111318;
    color: #7CFFB2;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 13px;
    line-height: 1.45;
    padding: 12px 14px;
    border-radius: 10px;
    white-space: pre;
  }
</style>
</head>
<body>

<div class="filler" id="filler"></div>

<div class="hdr">ШАПКА САЙТА</div>

<div class="band">
  <p>1 — этот текст должен уезжать ПОД шапку, а не быть виден над ней</p>
  <p>2 — прокрути немного вниз и сделай скриншот</p>
  <p>3 —</p><p>4 —</p><p>5 —</p><p>6 —</p><p>7 —</p><p>8 —</p>
  <p>9 —</p><p>10 —</p><p>11 —</p><p>12 —</p><p>13 —</p><p>14 —</p>
  <p>15 —</p><p>16 —</p><p>17 —</p><p>18 —</p><p>19 —</p><p>20 —</p>
</div>

<pre id="out"></pre>

<script>
var hdr = document.querySelector('.hdr');
var filler = document.getElementById('filler');
var out = document.getElementById('out');

function readSafeArea() {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;padding-top:env(safe-area-inset-top,0px)';
  document.body.appendChild(d);
  var v = getComputedStyle(d).paddingTop;
  d.remove();
  return v;
}

function update() {
  var top = hdr.getBoundingClientRect().top;
  filler.style.height = top > 0 ? top + 'px' : '0px';

  var vv = window.visualViewport;
  var lines = [
    'верх шапки (rect.top) : ' + Math.round(top),
    'высота заглушки       : ' + filler.style.height,
    'scrollY               : ' + Math.round(window.scrollY),
    'innerHeight           : ' + window.innerHeight,
    'clientHeight          : ' + document.documentElement.clientHeight,
    'safe-area-inset-top   : ' + readSafeArea()
  ];
  if (vv) {
    lines.push('visualViewport.height : ' + Math.round(vv.height));
    lines.push('vv.offsetTop          : ' + Math.round(vv.offsetTop));
    lines.push('vv.pageTop            : ' + Math.round(vv.pageTop));
    lines.push('vv.scale              : ' + vv.scale);
  } else {
    lines.push('visualViewport        : нет');
  }
  out.textContent = lines.join('\n');
}

update();
window.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
if (window.visualViewport) {
  window.visualViewport.addEventListener('scroll', update);
  window.visualViewport.addEventListener('resize', update);
}
setInterval(update, 300);
</script>

</body>
</html>
